<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple AI chatbot</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="chat-container">

        <!-- HEADER -->
        <header class="chat-header">

            <img
                src="images/SalfordLogo.png"
                alt="Salford City Council"
                class="salford-logo"
            >

            <div class="header-text">
                <h1>Simple AI chatbot</h1>
                <p>Ask me a question and I'll try to help.</p>
            </div>

            <div class="chat-icon" aria-hidden="true">
                💬
            </div>

        </header>


        <!-- CHAT AREA -->
        <section
            id="chat-box"
            class="chat-box"
            aria-live="polite"
            aria-label="Chat conversation"
        >

            <div class="message-row bot-row">

                <div class="bot-icon">
                    🤖
                </div>

                <div>
                    <div class="message bot-message">
                        Hello! I'm your AI Support Assistant.<br>
                        How can I help you today?
                    </div>
                </div>

            </div>

        </section>


        <!-- INPUT AREA -->
        <section class="input-container">

            <div class="input-wrapper">

                <label for="user-input" class="visually-hidden">
                    Type your question
                </label>

                <textarea
                    id="user-input"
                    maxlength="500"
                    placeholder="Type your question here..."
                    rows="2"
                ></textarea>

                <div
                    id="character-count"
                    class="character-count"
                    aria-live="polite"
                >
                    0 / 500 characters
                </div>

            </div>

            <button
                id="send-button"
                type="button"
                onclick="sendMessage()"
            >
                <span aria-hidden="true">➤</span>
                Send
            </button>

        </section>


        <!-- FOOTER -->
        <footer class="chat-footer">
            © Salford City Council
        </footer>

    </main>


    <script src="script.js"></script>

</body>
</html>
